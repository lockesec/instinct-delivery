trigger: Writing what looks like a credential into a config file
action: |
  This looks like a credential going into a file that is likely committed.
  Read it from the environment or a secret store instead, and keep the file
  free of the value.
match_tools: [Write, Edit]
match_content: ['(api[_-]?key|secret|password)\s*[:=]\s*["'']?[A-Za-z0-9_\-]{12,}']
confidence: 0.85
domain: security
follow:                 # acting on it: the value is replaced by an environment lookup
  tools: [Edit, Write]
  content: ['os\.environ|getenv|process\.env|\$\{[A-Z_]+\}']
  within: 3
tests:
  - {tool: Write, input: {file_path: config.yaml, content: "api_key: EXAMPLE_ONLY_not_a_real_key"}, expect: fires}
  - {tool: Write, input: {file_path: config.yaml, content: "api_key: ${API_KEY}"}, expect: silent}
