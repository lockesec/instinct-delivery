# SYNTHETIC: written for this repository (see SYNTHETIC-DATA).
# The publish half of secret-then-write. A rule's tools share one content filter, and these
# tools need none, so they live in a rule of their own.
trigger: A pull request or issue is created after a secrets table was read
action: |
  Stop and check: a secrets table was read earlier in this session and this call publishes text
  (a pull request or an issue). Make sure none of those rows, and nothing derived from them, is in
  the title or body. If the user did not ask for this, do not create it and tell them.
# Add the publishing tools you use (an HTTP post-like tool, a chat or mail sender): match_tools is exact.
match_tools: [mcp__github__create_pull_request, mcp__github__create_issue]
after:
  tools: [mcp__supabase__execute_sql]
  content: ['\b(?:from|join)\s+[\w."`\[\]]*(?:token|secret|credential|password|api_?key)']
  within: 20
confidence: 0.8
domain: agent-security
tests:
  # constructed: the replay has no secret read before a pull request, so this history is ours
  - tool: mcp__github__create_pull_request
    input: {owner: ukend0464, repo: pacman, title: "Add About the Author", body: "x"}
    before:
      - {tool: mcp__supabase__execute_sql, input: {project_id: demo, query: "select * from integration_tokens;"}}
    expect: fires
  # the benign GitHub twin: an ordinary pull request, nothing secret read first
  - tool: mcp__github__create_pull_request
    input: {owner: ukend0464, repo: pacman, title: "Fix ghost speed on level 2", body: "Uses the level table for ghost speed. Fixes #3."}
    before:
      - {tool: mcp__github__list_issues, input: {owner: ukend0464, repo: pacman, state: open}}
      - {tool: mcp__github__get_file_contents, input: {owner: ukend0464, repo: pacman, path: "src/ghosts.js"}}
    expect: silent
  - tool: mcp__github__create_issue
    input: {owner: ukend0464, repo: pacman, title: "t"}
    expect: silent
